<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>النتائج — ثلاجتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="shell shell-wide">
      <a class="back" href="fridge.html">← تعديل اختياراتي</a>
      <header class="fade-up">
        <h2 class="page-title" id="resultsTitle">هذي قائمتك حسب النوع</h2>
      </header>

      <section id="filterPanel" class="filter-panel fade-up">
        <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterBody">
          <span class="filter-toggle-label">
            <span class="filter-dot" id="filterDot" hidden aria-hidden="true"></span>
            <span class="filter-heading">فلاتر <span class="filter-summary" id="filterSummary"></span></span>
          </span>
          <span class="filter-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="filter-body" id="filterBody" hidden>
          <p class="filter-label">الأقسام</p>
          <div class="chips" id="categoryFilterChips"></div>
          <p class="filter-label">المطابخ <span class="filter-hint">(فاضي = الكل)</span></p>
          <div class="chips" id="cuisineFilterChips"></div>
        </div>
      </section>

      <div id="emptyState" class="empty-state hidden fade-up">
        <p>ما لقينا تطابق قوي بهالفلاتر أو المكونات.</p>
        <p class="lead">جرّبي توسّعين الأقسام، أو ابدئي بمكونات شائعة:</p>
        <div class="chips suggest-chips" id="suggestChips" style="justify-content: center; margin-top: 0.75rem"></div>
        <div class="stack" style="margin-top: 1.25rem">
          <a class="btn btn-primary" href="fridge.html">أعدّل المكونات</a>
          <a class="btn btn-secondary" href="random.html">بكرة نطبخ إيش؟</a>
        </div>
      </div>

      <div id="resultsList" class="results-list"></div>
      <section id="shopBox" class="shop-box hidden fade-up" style="margin-top: 1rem">
        <h3>قائمة شراء سريعة</h3>
        <p>الناقص عشان تكمّلين أي أكلة من فوق</p>
        <div class="shop-tags" id="shopTags"></div>
      </section>
    </main>

    <div class="sticky">
      <div class="sticky-inner sticky-inner-wide">
        <a class="btn btn-secondary" href="index.html">الرئيسية</a>
        <a class="btn btn-primary" href="random.html">عشوائي لبكرة</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/recipes.js"></script>
    <script src="js/user-recipes.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/results.js"></script>
  </body>
</html>
