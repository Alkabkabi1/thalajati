<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>ثلاجتي — قرّري أكل البيت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-home">
    <main class="shell fade-up">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 80" width="72" height="90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="6" width="44" height="68" rx="6" stroke="currentColor" stroke-width="3" />
            <line x1="10" y1="36" x2="54" y2="36" stroke="currentColor" stroke-width="3" />
            <rect x="16" y="14" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2.5" />
            <rect x="16" y="44" width="22" height="18" rx="2" stroke="currentColor" stroke-width="2.5" />
            <circle cx="46" cy="20" r="2.5" fill="currentColor" />
            <circle cx="46" cy="52" r="2.5" fill="currentColor" />
          </svg>
        </div>
        <p class="brand-kicker">أكل البيت بقرار أوضح</p>
        <h1>ثلاجتي</h1>
        <p>قرّري أكل البيت من اللي عندك، أو خذي اقتراح عشوائي لبكرة بدون تكرار ممل.</p>
        <div id="homePreview" class="home-preview" aria-label="مثال على شكل النتيجة"></div>
      </header>

      <div class="stack">
        <a class="btn btn-primary" href="fridge.html">وش أسوي من ثلاجتي؟</a>
        <a class="btn btn-secondary" href="random.html">بكرة نطبخ إيش؟</a>
      </div>

      <p class="hint">٣ أسئلة قصيرة · بدون حساب · وصفات بيتية مع صور</p>
    </main>

    <script src="js/recipes.js"></script>
    <script src="js/ui.js"></script>
    <script>
      (function () {
        var preview = document.getElementById("homePreview");
        var sample =
          Thalajati.RECIPES.find(function (r) {
            return r.id === "kabsa";
          }) || Thalajati.RECIPES[0];
        if (sample) preview.innerHTML = Thalajati.renderPreviewCard(sample);
      })();
    </script>
  </body>
</html>
